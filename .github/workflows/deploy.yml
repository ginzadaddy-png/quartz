name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build -d content/wiki
      - name: Copy report/deck HTML files
        run: |
          # Quartz의 slugifyFilePath이 .html 확장자를 자동으로 제거(.md와 동일 처리)해서
          # Assets emitter가 잘못된 path로 copy함. 별도 step에서 .html을 정확한 path에 그대로 copy.
          if [ -d "content/wiki/reports" ]; then
            mkdir -p public/reports
            find content/wiki/reports -maxdepth 1 -name "*.html" -exec cp {} public/reports/ \;
            echo "Copied .html decks to public/reports/:"
            ls -la public/reports/*.html 2>/dev/null || echo "(no .html files)"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
